name: Node.js CI

on:
  push:
    branches: [ main, develop, qa ]
  pull_request:
    branches: [ main, develop, qa ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        
    - name: Install Dependencies
      run: npm ci --ignore-scripts
      
    - name: Run Code Check
      run: |
        echo "Validando sintaxis y estructura del código..."
        npm run lint