name: Node.js CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        
    - name: Install Dependencies
      run: npm install
      
    - name: Run Code Check
      run: |
        echo "Validando sintaxis y estructura del código..."
        # Aquí se ejecutarán los linters o pruebas en el futuro. Por ahora simula éxito.
        exit 0